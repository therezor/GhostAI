name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # A step of its own, not folded into `pnpm lint`. The three rules — no
      # `px` outside `tokens.css`, no raw hex/rgb/oklch outside it, and no
      # `--color-accent` in a text or border position — hold across CSS, TSX
      # class strings and `index.html`, and no single linter reads all three.
      # Named separately so a failure says which gate, on the summary page,
      # without anyone opening the log.
      - name: Design token gates
        run: pnpm --filter @ghostwire/web exec tsx src/tokens/run-gates.ts

      - name: Format check
        run: pnpm format:check

      # The other half of the translation gate. `pnpm test` runs the source
      # sweep that finds copy which never became a key; this finds keys that
      # were used and never reached the bundle a translator reads. Neither
      # substitutes for the other — see `i18next-parser.base.js`.
      - name: Translations are in step
        run: pnpm i18n:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage gates
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The suite serves the built SPA through the real server, so the build is
      # a precondition rather than a convenience: without it the harness fails
      # at `resolveUiRoot` with a sentence, which is the intended failure but
      # not a useful CI run.
      - name: Build
        run: pnpm build

      # Only the browser the suite uses. `--with-deps` installs the shared
      # libraries a headless Chromium needs on a bare runner.
      - name: Install Chromium
        run: pnpm --filter @ghostwire/e2e exec playwright install --with-deps chromium

      # Both colour schemes, because the projects are the themes: a component
      # that only works in dark is a failing test here rather than something
      # someone notices in review.
      #
      # The fidelity gate skips itself — it measures against a checkout of the
      # product being replaced, which is not on a CI machine and is not going to
      # be. It runs locally, and `pnpm --filter @ghostwire/e2e baseline` is what
      # produces the pictures beside it.
      - name: End-to-end
        run: pnpm --filter @ghostwire/e2e test:e2e

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: packages/e2e/artifacts/
          retention-days: 7
