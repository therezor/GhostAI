name: Release

# A tag, not a branch. `ci.yml` runs on pushes to main and on pull requests, so
# a tag push currently triggers nothing at all — which is why the gate is
# repeated here rather than depended on. Tagging is the whole release ceremony:
# bump the root `version`, run `node scripts/gen-packages.mjs` to carry it into
# every manifest, commit, tag, push.
on:
  push:
    tags: ['v*']

permissions:
  # For the GitHub Release and its attached tarballs.
  contents: write
  # For the OIDC token npm exchanges for a publish credential, and for the
  # provenance it then generates. Provenance also needs each package's
  # `repository` field to name this repository, which `scripts/gen-packages.mjs`
  # writes.
  id-token: write

jobs:
  # The same checks `ci.yml` runs, because a tag can be pushed from a branch
  # that never saw them and an unpublish is only possible for 72 hours — and
  # never for a name you then want to reuse.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design token gates
        run: pnpm --filter @ghostwire/web exec tsx src/tokens/run-gates.ts

      - name: Format check
        run: pnpm format:check

      - name: Translations are in step
        run: pnpm i18n:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The tag has to name the version that would actually publish. Without
      # this, `git tag v1.1.0` on a tree still saying `1.0.0` republishes 1.0.0
      # — which fails as "cannot publish over an existing version" only if that
      # version was already released, and silently ships the wrong number if it
      # was not.
      - name: The tag matches the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          if [ "$tag" != "$root" ]; then
            echo "Tag $GITHUB_REF_NAME does not match root version $root." >&2
            exit 1
          fi
          # Every publishable package moves in lockstep: `pnpm publish` rewrites
          # `workspace:*` to the exact version, so one package left behind
          # publishes a dependency range that resolves to nothing.
          #
          # **The list comes from pnpm, not from `readdir packages/`.** It used
          # to be the latter, and that is a check whose idea of "publishable"
          # can differ from the one doing the publishing: a package that lives
          # outside `packages/` would publish without this ever having looked at
          # it. Asking pnpm for the workspace — the same enumeration
          # `pnpm -r publish` walks, minus the `private` ones it skips — is what
          # makes the two impossible to disagree about, for whatever is added next.
          pnpm -r list --depth -1 --json > /tmp/workspace.json
          node -e '
            const {readFileSync} = require("node:fs");
            const want = process.argv[1];
            const bad = JSON.parse(readFileSync("/tmp/workspace.json", "utf8"))
              .filter((pkg) => !pkg.private && pkg.version !== want)
              .map((pkg) => `${pkg.name}@${pkg.version}`);
            if (bad.length) {
              console.error(`Not at ${want}: ${bad.join(", ")}`);
              console.error(
                "Bump the root version, run node scripts/gen-packages.mjs," +
                  " then commit.",
              );
              process.exit(1);
            }
          ' "$root"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # **No `registry-url` here, and that is the whole of it.** Giving it makes
      # `setup-node` write an `.npmrc` containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and export
      # `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX`, a dummy, for every step in
      # the job. So dropping the `NPM_TOKEN` env below did not leave the
      # publish with no credential — it left it with a *fake* one, which pnpm
      # duly sent as a bearer token. npm rejected it, and because a credential
      # was present the OIDC exchange never got to be the auth source: both the
      # exchange and the `PUT` answered 404, and 404 is what npm says instead of
      # 403. pnpm/pnpm#11526 fixes the neighbouring case where the variable is
      # *unset*; setup-node's placeholder resolves, so that fix does not reach
      # this one.
      #
      # Nothing is lost by omitting it: `registry.npmjs.org` is already pnpm's
      # default registry, and trusted publishing brings its own credential.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # From a clean checkout, deliberately. `tsup` runs with `clean: false` —
      # it has to, or it would delete the declarations `tsc -b` writes into the
      # same `dist` — so a long-lived working copy accumulates stale chunks that
      # a local `pnpm pack` would ship. A runner has no such history.
      - name: Build
        run: pnpm build

      # `--no-git-checks` because a tagged checkout is a detached HEAD, which
      # pnpm otherwise refuses. `-r` skips `private: true` on its own, which is
      # what leaves `@ghostwire/e2e` and both `examples/*` behind.
      #
      # **No token and no `--provenance`, both deliberately.** This publishes
      # through npm's trusted publishing: pnpm exchanges the workflow's OIDC
      # token for a short-lived, workflow-scoped credential, which is why the
      # `NPM_TOKEN` secret is gone — there is no long-lived token in this
      # repository to leak or to expire. Each of the fifteen packages names
      # `therezor/GhostAI` and this file by name as its trusted publisher, so a
      # publish from anywhere else is refused by the registry rather than by us.
      #
      # `--provenance` is dropped because trusted publishing generates the
      # attestation *registry-side* and the flag is documented as unnecessary.
      # It is not merely redundant. With the flag, the runner builds the
      # attestation itself and writes it to Sigstore's public transparency log
      # — and that write is what stopped 0.7.3: the client created an entry,
      # hit a transient error, retried, and collided with the entry it had just
      # made (`409 an equivalent entry already exists`, a different UUID every
      # attempt). Three runs failed identically at the first package. Nothing
      # here can retry its way past that, so the release stopped doing the
      # write.
      #
      # If this step ever fails with a 404 on `PUT`, read it as "not
      # authorised" rather than "no such package" — npm answers an unauthorised
      # publish with 404 so it does not leak whether a name exists. The usual
      # cause is a package whose trusted publisher was never configured, or one
      # naming a different workflow file.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks

      # The air-gapped route: the same tarballs, attached to the release, for an
      # install that never reaches a registry.
      - name: Pack tarballs
        run: pnpm -r exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-tarballs/*.tgz
          generate_release_notes: true
